[project]
# The distribution is `omega-coding` because `omega` is taken on PyPI (v0.4.0, a
# games library). The console script below is still `omega`, so nothing
# user-facing changes — a distribution name and a command are different things,
# exactly as Tau publishes `tau-ai` and installs `tau`.
name = "omega-coding"
version = "0.1.0"
description = "A terminal coding agent, built from scratch in layers."
readme = "README.md"
# Tau's two lines (research/tau/pyproject.toml:10-11). The file is a copy of the
# repository-root LICENSE: a license file has to sit inside the project it ships
# with, and this project is `omega/`, not the repository.
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
    "anthropic>=0.120.2",
    # Imported directly by `omega_coding/oauth.py`, which talks to a plain OAuth
    # endpoint rather than to a vendor. It arrives transitively through the two
    # SDKs anyway, but a direct import needs a direct declaration or the day one
    # of them drops it is the day omega stops starting.
    "httpx>=0.28",
    "openai>=3.3.1",
    "pydantic>=2.11",
    "python-dotenv>=1.2.2",
    "textual>=8.2.8",
]

[project.scripts]
omega = "omega_coding.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/omega_ai", "src/omega_agent", "src/omega_coding"]

# The sdist takes everything in `omega/` that git does not ignore, and the
# website lives in `omega/website/` — so without this a Python package shipped a
# Next.js site: 41 files from a clean checkout, 253 MB with `node_modules` from
# a local one. The leading `/` anchors the path to this directory.
[tool.hatch.build.targets.sdist]
exclude = ["/website"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src"]
